name: Validate collector mean

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install software/autonomous-csi-collector
      - working-directory: software/autonomous-csi-collector
        run: PYTHONDONTWRITEBYTECODE=1 python -B -m unittest discover -s tests -v
      - run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/check_public_tree.py
      - run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/validate_repository.py
