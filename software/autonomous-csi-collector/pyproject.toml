[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cws-autonomous-collector"
version = "0.6.3"
description = "Resumable, chunked ESP32 CSI collection for unattended operation"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.scripts]
cws-collector = "cws_collector.cli:main"

[tool.setuptools.packages.find]
include = ["cws_collector*"]
